name: Import GrabShift build
on:
  push:
    paths:
      - '.github/workflows/import-grabshift.yml'
permissions:
  contents: write
jobs:
  build-and-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: false
      - name: Build the original GrabShift project
        run: |
          git clone --depth 1 --branch master https://github.com/LakshmiNarayanan2003/grabshift.git /tmp/grabshift
          cd /tmp/grabshift
          npm ci
          npm run build
      - name: Copy the built game into Mindspace
        run: |
          mkdir -p arcade-pro/grabshift
          cp -R /tmp/grabshift/dist/. arcade-pro/grabshift/
      - name: Commit the hosted game
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arcade-pro/grabshift
          git commit -m "Add locally hosted GrabShift game"
          git push
