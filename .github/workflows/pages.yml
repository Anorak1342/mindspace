name: Deploy Mindspace to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Mindspace
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download and copy the game source into Mindspace
        run: |
          git clone --depth 1 https://github.com/TMHSDigital/GH-Arcade.git /tmp/gh-arcade
          git clone --depth 1 https://github.com/stateloop-connected/source-vibe-basketball.git /tmp/vibe-basketball
          git clone --depth 1 https://github.com/Anorak1342/F-15-Flight-Sim-.git /tmp/f15-flight-sim
          git clone --depth 1 https://github.com/KhazP/librecorsa.git /tmp/librecorsa
          git clone --depth 1 https://github.com/KamranBoroomand/PacMan.git /tmp/pacman
          git clone --depth 1 https://github.com/gabrielecirulli/2048.git /tmp/2048
          git clone --depth 1 --branch gh-pages https://github.com/wayou/t-rex-runner.git /tmp/trex-runner
          git clone --depth 1 https://github.com/mgechev/mk.js.git /tmp/mkjs
          git clone --depth 1 --branch gh-pages https://github.com/lo-th/3d.city.git /tmp/3d-city
          git clone --depth 1 --branch gh-pages https://github.com/Hextris/hextris.git /tmp/hextris
          git clone --depth 1 https://github.com/basicallydan/skifree.js.git /tmp/skifree
          git clone --depth 1 https://github.com/SamadiPour/snack-hole-game.git /tmp/snack-hole-game
          git clone --depth 1 https://github.com/doublespeakgames/adarkroom.git /tmp/adarkroom
          git clone --depth 1 https://github.com/KonradLinkowski/Stack.git /tmp/stack-game
          git clone --depth 1 https://github.com/Trimps/Trimps.github.io.git /tmp/trimps
          git clone --depth 1 https://github.com/Cirrial/SharkGame.git /tmp/shark-game
          git clone --depth 1 https://github.com/doublespeakgames/gridland.git /tmp/gridland
          git clone --depth 1 https://github.com/ihtasham42/progress-knight.git /tmp/progress-knight
          git clone --depth 1 https://github.com/pmotschmann/Evolve.git /tmp/evolve
          git clone --depth 1 https://github.com/ThatOneMop/study-desk.git /tmp/study-desk
          git -C /tmp/snack-hole-game checkout 2f1e5699eb08e19b6e6b76ab1e28055c9295a27b
          mkdir -p arcade-pro/source/gh-arcade arcade-pro/source/vibe-basketball arcade-pro/source/f15-flight-sim arcade-pro/source/librecorsa arcade-pro/source/pacman arcade-pro/source/2048 arcade-pro/source/trex-runner
          cp -R /tmp/gh-arcade/. arcade-pro/source/gh-arcade/
          cp -R /tmp/vibe-basketball/. arcade-pro/source/vibe-basketball/
          cp -R /tmp/f15-flight-sim/. arcade-pro/source/f15-flight-sim/
          cp -R /tmp/librecorsa/. arcade-pro/source/librecorsa/
          cp -R /tmp/pacman/. arcade-pro/source/pacman/
          cp -R /tmp/2048/. arcade-pro/source/2048/
          cp -R /tmp/trex-runner/. arcade-pro/source/trex-runner/
          mkdir -p arcade-pro/dark-room
          cp -R /tmp/adarkroom/. arcade-pro/dark-room/
          cp /tmp/adarkroom/LICENSE.md arcade-pro/dark-room/LICENSE.txt
          rm -rf arcade-pro/dark-room/.git arcade-pro/dark-room/.github
          python3 - <<'PY'
          from pathlib import Path
          p = Path('arcade-pro/dark-room/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.10.1/jquery.min.js"></script>', '')
          start = s.find('\\t<!-- Google tag (gtag.js) -->')
          if start != -1:
              config_start = s.find('gtag(', start)
              end = s.find('</script>', config_start)
              if end != -1:
                  s = s[:start] + s[end + len('</script>'):]
          p.write_text(s, encoding='utf-8')
          PY
          mkdir -p arcade-pro/trimps
          cp -R /tmp/trimps/. arcade-pro/trimps/
          cp /tmp/trimps/license.txt arcade-pro/trimps/LICENSE.txt
          rm -rf arcade-pro/trimps/.git arcade-pro/trimps/.github
          mkdir -p arcade-pro/shark-game
          cp -R /tmp/shark-game/. arcade-pro/shark-game/
          cp /tmp/shark-game/LICENSE.md arcade-pro/shark-game/LICENSE.txt
          rm -rf arcade-pro/shark-game/.git arcade-pro/shark-game/.github
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('arcade-pro/shark-game/index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'<script[^>]*>.*?GoogleAnalyticsObject.*?</script>', '', s, flags=re.I | re.S)
          s = re.sub(r'<!--\\[if lt IE 9\\]>.*?<!\\[endif\\]-->', '', s, flags=re.I | re.S)
          p.write_text(s, encoding='utf-8')
          PY
          mkdir -p arcade-pro/gridland
          cp -R /tmp/gridland/deploy/. arcade-pro/gridland/
          cp /tmp/gridland/LICENSE arcade-pro/gridland/LICENSE.txt
          mkdir -p arcade-pro/progress-knight
          cp -R /tmp/progress-knight/. arcade-pro/progress-knight/
          rm -rf arcade-pro/progress-knight/.git
          cp /tmp/progress-knight/LICENSE arcade-pro/progress-knight/LICENSE.txt
          mkdir -p arcade-pro/sloper arcade-pro/traffic-lane
          cp -R /tmp/study-desk/games/winterfold/. arcade-pro/sloper/
          cp -R /tmp/study-desk/games/lanewright/. arcade-pro/traffic-lane/
          cp /tmp/study-desk/bridge.js arcade-pro/bridge.js
          cp /tmp/study-desk/LICENSE arcade-pro/STUDY-DESK-BRIDGE-LICENSE.txt
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              'arcade-pro/sloper/index.html': [('Winterfold — Study Desk', 'Sloper · Mindspace'), ('<h1>Winter<i>fold</i></h1>', '<h1>Sloper</h1>'), ('<h2>Winterfold</h2>', '<h2>Sloper</h2>'), ('Winterfold save', 'Sloper save'), ('../../bridge.js', '../bridge.js')],
              'arcade-pro/sloper/engine.js': [('study-desk-winterfold-v1', 'mindspace-sloper-v1')],
              'arcade-pro/sloper/game.js': [('Winterfold', 'Sloper')],
              'arcade-pro/sloper/CREDITS.md': [('# Winterfold credits', '# Sloper credits'), ('Winterfold is an original game made for Study Desk.', 'Sloper is an original game, adapted for Mindspace with permission from its original collaborators.')],
              'arcade-pro/traffic-lane/index.html': [('Lanewright — Study Desk', 'Traffic Lane · Mindspace'), ('Lanewright', 'Traffic Lane'), ('lane that shares its colour', 'lane that shares its colour'), ('Lanewright save', 'Traffic Lane save'), ('../../bridge.js', '../bridge.js')],
              'arcade-pro/traffic-lane/engine.js': [('study-desk-lanewright-v1', 'mindspace-traffic-lane-v1')],
              'arcade-pro/traffic-lane/game.js': [('Lanewright', 'Traffic Lane')],
              'arcade-pro/traffic-lane/CREDITS.md': [('# Lanewright credits', '# Traffic Lane credits'), ('Lanewright is an original game made for Study Desk.', 'Traffic Lane is an original game, adapted for Mindspace with permission from its original collaborators.'), ('study-desk-lanewright-v1', 'mindspace-traffic-lane-v1')]
          }
          for name, pairs in replacements.items():
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              for old, new in pairs:
                  s = s.replace(old, new)
              p.write_text(s, encoding='utf-8')
          PY
          mkdir -p arcade-pro/evolve
          cd /tmp/evolve
          npm ci --no-audit --no-fund
          # This project lists Node 16 as a runtime dependency; remove its local shim so the build uses the Node 22 runner.
          rm -rf node_modules/node node_modules/.bin/node
          npm run build
          cp index.html save.html wiki.html evolved.ico evolved-light.ico LICENSE "$GITHUB_WORKSPACE/arcade-pro/evolve/"
          cp -R evolve lib font strings wiki "$GITHUB_WORKSPACE/arcade-pro/evolve/"
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('arcade-pro/evolve/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('    <script async src="https://www.googletagmanager.com/gtag/js?id=G-CPC46V71CB"></script>\n', '')
          start = s.find('    <script>\n        window.dataLayer')
          if start != -1:
              end = s.find('    </script>', start)
              if end != -1:
                  s = s[:start] + s[end + len('    </script>'):]
          p.write_text(s, encoding='utf-8')
          PY
          mkdir -p arcade-pro/stack
          cd /tmp/stack-game
          npm install --no-audit --no-fund
          npm run build
          cp -R dist/. "$GITHUB_WORKSPACE/arcade-pro/stack/"
          cp LICENSE "$GITHUB_WORKSPACE/arcade-pro/stack/LICENSE.txt"
          cd "$GITHUB_WORKSPACE"
          mkdir -p arcade-pro/hextris
          cp -R /tmp/hextris/. arcade-pro/hextris/
          mkdir -p arcade-pro/skifree
          cp -R /tmp/skifree/index.html /tmp/skifree/css /tmp/skifree/dist /tmp/skifree/js /tmp/skifree/*.png /tmp/skifree/yeti-big.png arcade-pro/skifree/ 2>/dev/null || true
          cp /tmp/skifree/license.md arcade-pro/skifree/LICENSE.txt
          python3 - <<'PY'
          from pathlib import Path
          p = Path('arcade-pro/skifree/index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<script src="dist/skifree.js"></script>'
          s = s[:s.index(marker) + len(marker)] + '\\n    </body>\\n</html>\\n'
          p.write_text(s, encoding='utf-8')
          PY
          sed -i 's|</body>|<p style="position:fixed;bottom:8px;left:8px;background:#fff;color:#222;padding:5px 8px;font:12px sans-serif;z-index:99">SkiFree.js by Daniel Hough · MIT License</p></body>|' arcade-pro/skifree/index.html
          rm -rf arcade-pro/hextris/.git arcade-pro/hextris/.github
          mkdir -p arcade-pro/3d-city
          cp -R /tmp/3d-city/. arcade-pro/3d-city/
          rm -rf arcade-pro/3d-city/.git arcade-pro/3d-city/.github
          mkdir -p arcade-pro/mk-fighter
          cp -R /tmp/mkjs/game/. arcade-pro/mk-fighter/
          cp /tmp/mkjs/readme.md arcade-pro/mk-fighter/MKJS-README.md
          cp mk-fighter/index.html arcade-pro/mk-fighter/index.html
          rm -rf arcade-pro/source/gh-arcade/.git arcade-pro/source/vibe-basketball/.git arcade-pro/source/f15-flight-sim/.git arcade-pro/source/librecorsa/.git arcade-pro/source/pacman/.git arcade-pro/source/2048/.git arcade-pro/source/trex-runner/.git
          rm -rf arcade-pro/source/gh-arcade/node_modules arcade-pro/source/vibe-basketball/node_modules arcade-pro/source/f15-flight-sim/node_modules arcade-pro/source/librecorsa/node_modules arcade-pro/source/librecorsa/.next arcade-pro/source/librecorsa/out arcade-pro/source/pacman/node_modules
          # Keep downloaded upstream source in the build workspace only.
          # Do not push it back to main: that creates a second deployment run.

      - name: Type-check and build the copied Neon Arcade source
        run: |
          cd arcade-pro/source/gh-arcade
          sed -i "s|const BASE = '/GH-Arcade/';|const BASE = '/mindspace/arcade-pro/';|" vite.config.ts
          npm ci
          npm run typecheck
          npm run build
          cp -R dist/. "$GITHUB_WORKSPACE/arcade-pro/"
          cp LICENSE "$GITHUB_WORKSPACE/arcade-pro/NEON-ARCADE-LICENSE.txt"

      - name: Build Pac-Man
        run: |
          cd arcade-pro/source/pacman
          npm ci
          npm run check
          npm run build
          mkdir -p "$GITHUB_WORKSPACE/arcade-pro/pacman"
          cp -R dist/. "$GITHUB_WORKSPACE/arcade-pro/pacman/"
          cp LICENSE "$GITHUB_WORKSPACE/arcade-pro/pacman/LICENSE.txt"

      - name: Build Snack Hole
        run: |
          cd /tmp/snack-hole-game
          npm ci
          npm run build -- --base=./
          mkdir -p "$GITHUB_WORKSPACE/arcade-pro/snack-hole"
          cp -R dist/. "$GITHUB_WORKSPACE/arcade-pro/snack-hole/"
          cp LICENSE "$GITHUB_WORKSPACE/arcade-pro/snack-hole/LICENSE.txt"
          cp CREDITS.md "$GITHUB_WORKSPACE/arcade-pro/snack-hole/CREDITS.md"

      - name: Remove tracking and ad scripts from Hextris
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('arcade-pro/hextris/index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'<script[^>]*googlesyndication[^>]*>.*?</script>', '', s, flags=re.I | re.S)
          s = re.sub(r'<script>.*?GoogleAnalyticsObject.*?</script>', '', s, flags=re.I | re.S)
          s = s.replace('http://fonts.googleapis.com', 'https://fonts.googleapis.com')
          s = s.replace('http://hextris.github.io', 'https://hextris.github.io')
          p.write_text(s, encoding='utf-8')
          PY
          cp arcade-pro/hextris/LICENSE.md arcade-pro/hextris/LICENSE.txt

      - name: Publish 2048 locally
        run: |
          mkdir -p arcade-pro/2048
          cp -R arcade-pro/source/2048/. arcade-pro/2048/

      - name: Publish T-Rex Runner locally
        run: |
          mkdir -p arcade-pro/trex-runner
          cp -R arcade-pro/source/trex-runner/. arcade-pro/trex-runner/
          rm -rf arcade-pro/trex-runner/.github arcade-pro/trex-runner/.git
          sed -i '/fonts.googleapis.com/d' arcade-pro/trex-runner/index.html
          cp arcade-pro/source/trex-runner/LICENSE arcade-pro/trex-runner/LICENSE.txt

      - name: Build the copied 3D basketball source
        run: |
          cd arcade-pro/source/vibe-basketball
          npm ci
          npm run build -- --base=./
          mkdir -p "$GITHUB_WORKSPACE/arcade-pro/basketball"
          cp -R dist/. "$GITHUB_WORKSPACE/arcade-pro/basketball/"
          cp LICENSE "$GITHUB_WORKSPACE/arcade-pro/basketball/LICENSE.txt"
          cp THIRD_PARTY_NOTICES.md "$GITHUB_WORKSPACE/arcade-pro/basketball/THIRD_PARTY_NOTICES.md"

      - name: Publish the F-15 Flight Sim locally
        run: |
          mkdir -p arcade-pro/f15-flight-sim
          cp arcade-pro/source/f15-flight-sim/F-15_Eagle_Flight_Simulator_v7.html arcade-pro/f15-flight-sim/index.html

      - name: Build LibreCorsa racing simulator
        run: |
          cd arcade-pro/source/librecorsa
          npm ci
          NEXT_PUBLIC_BASE_PATH=/mindspace/arcade-pro/librecorsa npm run build
          mkdir -p "$GITHUB_WORKSPACE/arcade-pro/librecorsa"
          cp -R out/. "$GITHUB_WORKSPACE/arcade-pro/librecorsa/"
          cp LICENSE "$GITHUB_WORKSPACE/arcade-pro/librecorsa/LICENSE.txt"
          cp CREDITS.md "$GITHUB_WORKSPACE/arcade-pro/librecorsa/CREDITS.md"

      - name: Add the three-Enter lock shortcut to every page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          script = r'''<script id="mindspace-lock-shortcut">
          (function () {
            var count = 0;
            var lastPress = 0;
            window.addEventListener("keydown", function (event) {
              if (event.key !== "Enter" || event.repeat || event.isComposing) return;
              var now = Date.now();
              count = now - lastPress <= 3000 ? count + 1 : 1;
              lastPress = now;
              event.preventDefault();
              if (count < 3) return;
              count = 0;
              event.stopPropagation();
              event.stopImmediatePropagation();
              var path = window.location.pathname;
              var base = path === "/mindspace" || path.indexOf("/mindspace/") === 0 ? "/mindspace/" : "/";
              var home = path === base || path === base + "index.html";
              if (home) {
                try { localStorage.setItem("ms-arcade-unlocked", "yes"); } catch (error) {}
                window.location.assign(base + "arcade.html");
              } else {
                try { localStorage.removeItem("ms-arcade-unlocked"); } catch (error) {}
                window.location.assign(base);
              }
            }, true);
          })();
          </script>'''
          for page in Path(".").rglob("*.html"):
              if ".git" in page.parts or "source" in page.parts:
                  continue
              content = page.read_text(encoding="utf-8")
              if 'id="mindspace-lock-shortcut"' in content:
                  continue
              if "</body>" in content:
                  content = content.replace("</body>", script + "\n</body>", 1)
              else:
                  content += script
              page.write_text(content, encoding="utf-8")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
