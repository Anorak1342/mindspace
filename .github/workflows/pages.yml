name: Deploy Mindspace to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Mindspace
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Copy and build the complete Neon Arcade source
        run: |
          git clone --depth 1 https://github.com/TMHSDigital/GH-Arcade.git /tmp/gh-arcade
          mkdir -p "$GITHUB_WORKSPACE/arcade-pro/source/gh-arcade"
          cp -R /tmp/gh-arcade/. "$GITHUB_WORKSPACE/arcade-pro/source/gh-arcade/"
          cd "$GITHUB_WORKSPACE/arcade-pro/source/gh-arcade"
          sed -i "s|const BASE = '/GH-Arcade/';|const BASE = '/mindspace/arcade-pro/';|" vite.config.ts
          npm ci
          npm run typecheck
          npm run build
          cp -R dist/. "$GITHUB_WORKSPACE/arcade-pro/"
          cp LICENSE "$GITHUB_WORKSPACE/arcade-pro/NEON-ARCADE-LICENSE.txt"

      - name: Copy and build the 3D basketball source
        run: |
          git clone --depth 1 https://github.com/stateloop-connected/source-vibe-basketball.git /tmp/vibe-basketball
          mkdir -p "$GITHUB_WORKSPACE/arcade-pro/source/vibe-basketball"
          cp -R /tmp/vibe-basketball/. "$GITHUB_WORKSPACE/arcade-pro/source/vibe-basketball/"
          cd "$GITHUB_WORKSPACE/arcade-pro/source/vibe-basketball"
          npm ci
          npm run build -- --base=./
          mkdir -p "$GITHUB_WORKSPACE/arcade-pro/basketball"
          cp -R dist/. "$GITHUB_WORKSPACE/arcade-pro/basketball/"
          cp LICENSE "$GITHUB_WORKSPACE/arcade-pro/basketball/LICENSE.txt"
          cp THIRD_PARTY_NOTICES.md "$GITHUB_WORKSPACE/arcade-pro/basketball/THIRD_PARTY_NOTICES.md"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
