name: Deploy Mindspace to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Mindspace
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download and copy the game source into Mindspace
        run: |
          git clone --depth 1 https://github.com/TMHSDigital/GH-Arcade.git /tmp/gh-arcade
          git clone --depth 1 https://github.com/stateloop-connected/source-vibe-basketball.git /tmp/vibe-basketball
          mkdir -p arcade-pro/source/gh-arcade arcade-pro/source/vibe-basketball
          cp -R /tmp/gh-arcade/. arcade-pro/source/gh-arcade/
          cp -R /tmp/vibe-basketball/. arcade-pro/source/vibe-basketball/
          rm -rf arcade-pro/source/gh-arcade/.git arcade-pro/source/vibe-basketball/.git
          rm -rf arcade-pro/source/gh-arcade/node_modules arcade-pro/source/vibe-basketball/node_modules
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arcade-pro/source/gh-arcade arcade-pro/source/vibe-basketball
          if ! git diff --cached --quiet; then
            git commit -m "Copy arcade game source into Mindspace"
            git push
          fi

      - name: Type-check and build the copied Neon Arcade source
        run: |
          cd arcade-pro/source/gh-arcade
          sed -i "s|const BASE = '/GH-Arcade/';|const BASE = '/mindspace/arcade-pro/';|" vite.config.ts
          npm ci
          npm run typecheck
          npm run build
          cp -R dist/. "$GITHUB_WORKSPACE/arcade-pro/"
          cp LICENSE "$GITHUB_WORKSPACE/arcade-pro/NEON-ARCADE-LICENSE.txt"

      - name: Build the copied 3D basketball source
        run: |
          cd arcade-pro/source/vibe-basketball
          npm ci
          npm run build -- --base=./
          mkdir -p "$GITHUB_WORKSPACE/arcade-pro/basketball"
          cp -R dist/. "$GITHUB_WORKSPACE/arcade-pro/basketball/"
          cp LICENSE "$GITHUB_WORKSPACE/arcade-pro/basketball/LICENSE.txt"
          cp THIRD_PARTY_NOTICES.md "$GITHUB_WORKSPACE/arcade-pro/basketball/THIRD_PARTY_NOTICES.md"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
