name: Deploy Mindspace to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Mindspace
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download and copy the game source into Mindspace
        run: |
          git clone --depth 1 https://github.com/TMHSDigital/GH-Arcade.git /tmp/gh-arcade
          git clone --depth 1 --branch gh-pages https://github.com/Unblocked-Games-786/Soccer-Random.git /tmp/soccer-random
          git clone --depth 1 https://github.com/BasketRandom/BasketRandom.github.io.git /tmp/basket-random
          git clone --depth 1 --branch gh-pages https://github.com/Unblocked-Games-786/Boxing-Random.git /tmp/boxing-random
          git clone --depth 1 --filter=blob:none --sparse https://github.com/ChilakalaAnish/Volleyrandom.github.io.git /tmp/volley-random
          git -C /tmp/volley-random sparse-checkout set file
          git clone --depth 1 https://github.com/stateloop-connected/source-vibe-basketball.git /tmp/vibe-basketball
          git clone --depth 1 https://github.com/Anorak1342/F-15-Flight-Sim-.git /tmp/f15-flight-sim
          git clone --depth 1 https://github.com/pjo/starstruck.git /tmp/starstruck
          git clone --depth 1 https://github.com/KhazP/librecorsa.git /tmp/librecorsa
          git clone --depth 1 https://github.com/KamranBoroomand/PacMan.git /tmp/pacman
          git clone --depth 1 https://github.com/gabrielecirulli/2048.git /tmp/2048
          git clone --depth 1 --branch gh-pages https://github.com/wayou/t-rex-runner.git /tmp/trex-runner
          git clone --depth 1 https://github.com/mgechev/mk.js.git /tmp/mkjs
          git clone --depth 1 --branch gh-pages https://github.com/lo-th/3d.city.git /tmp/3d-city
          git clone --depth 1 --branch gh-pages https://github.com/Hextris/hextris.git /tmp/hextris
          git clone --depth 1 https://github.com/basicallydan/skifree.js.git /tmp/skifree
          git clone --depth 1 https://github.com/SamadiPour/snack-hole-game.git /tmp/snack-hole-game
          git clone --depth 1 https://github.com/doublespeakgames/adarkroom.git /tmp/adarkroom
          git clone --depth 1 https://github.com/KonradLinkowski/Stack.git /tmp/stack-game
          git clone --depth 1 https://github.com/Trimps/Trimps.github.io.git /tmp/trimps
          git clone --depth 1 https://github.com/Cirrial/SharkGame.git /tmp/shark-game
          git clone --depth 1 https://github.com/doublespeakgames/gridland.git /tmp/gridland
          git clone --depth 1 https://github.com/ihtasham42/progress-knight.git /tmp/progress-knight
          git clone --depth 1 https://github.com/pmotschmann/Evolve.git /tmp/evolve
          git clone --depth 1 https://github.com/ThatOneMop/study-desk.git /tmp/study-desk
          git clone --depth 1 https://github.com/particle-clicker/particle-clicker.git /tmp/particle-clicker
          git clone --depth 1 https://github.com/wwwtyro/Astray.git /tmp/astray
          git clone --depth 1 https://github.com/Leonxlnx/level-devil.git /tmp/fabledevil
          git clone --depth 1 https://github.com/EvanBacon/Expo-Crossy-Road.git /tmp/crossy-road
          # Edge Surf is embedded from its existing public host to preserve Microsoft's original game unchanged.
          git -C /tmp/snack-hole-game checkout 2f1e5699eb08e19b6e6b76ab1e28055c9295a27b
          # Build Evan Bacon's original Expo Crossy Road project for the web.
          # No game source, graphics, models, audio, or gameplay code is edited.
          cd /tmp/crossy-road
          npm install --legacy-peer-deps --no-audit --no-fund
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("app.json")
          config = json.loads(p.read_text(encoding="utf-8"))
          config.setdefault("expo", {}).setdefault("experiments", {})["baseUrl"] = "/mindspace/arcade-pro/crossy-road/game"
          p.write_text(json.dumps(config, indent=2) + "\n", encoding="utf-8")
          PY
          npx expo export -p web --output-dir dist
          cd -
          mkdir -p arcade-pro/crossy-road/game
          cp -R /tmp/crossy-road/dist/. arcade-pro/crossy-road/game/
          cat > arcade-pro/crossy-road/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>Crossy Road · Mindspace</title>
            <style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#87c6ff}iframe{display:block;width:100%;height:100%;border:0}</style>
          </head>
          <body><iframe src="./game/" title="Original Crossy Road" allow="fullscreen; autoplay; gamepad" allowfullscreen></iframe></body>
          </html>
          HTML
          cp /tmp/crossy-road/LICENSE arcade-pro/crossy-road/LICENSE.txt
          mkdir -p arcade-pro/edge-surf
          cat > arcade-pro/edge-surf/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>Edge Surf · Mindspace</title>
            <style>
              *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071b2b;color:#fff;font:15px system-ui,sans-serif}
              iframe{display:block;width:100%;height:100%;border:0}
              .fallback{position:fixed;z-index:2;left:12px;bottom:10px;padding:8px 12px;border-radius:8px;background:#ffffffdf;color:#172333;text-decoration:none;font-weight:700}
            </style>
          </head>
          <body>
            <iframe src="https://surf.jackbuehner.com/" title="Original Microsoft Edge Surf game" allow="fullscreen; autoplay; gamepad" allowfullscreen></iframe>
            <a class="fallback" href="https://surf.jackbuehner.com/" target="_blank" rel="noopener noreferrer">Open Edge Surf directly ↗</a>
          </body>
          </html>
          HTML
          # Publish the four requested Random sports games locally inside Mindspace.
          mkdir -p arcade-pro/soccer-random arcade-pro/basket-random arcade-pro/boxing-random arcade-pro/volley-random
          cp -R /tmp/soccer-random/. arcade-pro/soccer-random/
          cp -R /tmp/basket-random/. arcade-pro/basket-random/
          cp -R /tmp/boxing-random/. arcade-pro/boxing-random/
          # The Volley Random repository's playable Construct build is in its /file directory.
          cp -R /tmp/volley-random/file/. arcade-pro/volley-random/
          # Add two locally hosted games with their original licence notices.
          mkdir -p arcade-pro/particle-clicker arcade-pro/astray
          cp -R /tmp/particle-clicker/. arcade-pro/particle-clicker/
          cp /tmp/particle-clicker/LICENSE arcade-pro/particle-clicker/LICENSE.txt
          cp -R /tmp/astray/. arcade-pro/astray/
          cp /tmp/astray/License.md arcade-pro/astray/LICENSE.txt
          # FableDevil is a self-contained browser game; keep its MIT licence and remove analytics.
          mkdir -p arcade-pro/fabledevil
          cp -R /tmp/fabledevil/. arcade-pro/fabledevil/
          cp /tmp/fabledevil/LICENSE arcade-pro/fabledevil/LICENSE.txt
          rm -rf arcade-pro/fabledevil/.git arcade-pro/fabledevil/.github
          rm -f arcade-pro/fabledevil/analytics.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path('arcade-pro/fabledevil/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<link rel="preconnect" href="https://fonts.googleapis.com" />', '')
          s = s.replace('<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />', '')
          s = s.replace('<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />', '')
          start = s.find('<script type="importmap">')
          if start != -1:
              end = s.find('</script>', start)
              if end == -1:
                  raise SystemExit('FableDevil import map is not closed')
              s = s[:start] + s[end + len('</script>'):]
          s = s.replace('<script type="module" src="analytics.js"></script>', '')
          p.write_text(s, encoding='utf-8')
          PY
          rm -rf arcade-pro/particle-clicker/.git arcade-pro/particle-clicker/.github arcade-pro/astray/.git arcade-pro/astray/.github
          # Keep Astray textures relative to its Mindspace subfolder, not the site root.
          sed -i "s|/ball.png|./ball.png|g; s|/concrete.png|./concrete.png|g; s|/brick.png|./brick.png|g" arcade-pro/astray/index.html
          # Remove the upstream analytics beacon from Particle Clicker.
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("arcade-pro/particle-clicker/index.html")
          s = p.read_text(encoding="utf-8")
          s = re.sub(r"<!-- Google Analytics -->.*?<!-- End Google Analytics -->", "", s, flags=re.S)
          p.write_text(s, encoding="utf-8")
          PY
          # The Basket Random repository contains a redirect in its landing page; remove it
          # so its locally bundled Construct game can run inside Mindspace.
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('arcade-pro/basket-random/index.html')
          s = p.read_text(encoding='utf-8')
          s, count = re.subn(r'<script>\s*window\.location="https://ubg98\.github\.io/BasketRandom/"\s*;\s*</script>', '', s, count=1)
          if count != 1:
              raise SystemExit("Could not remove the Basket Random external redirect")
          p.write_text(s, encoding='utf-8')
          PY
          mkdir -p arcade-pro/source/gh-arcade arcade-pro/source/vibe-basketball arcade-pro/source/f15-flight-sim arcade-pro/source/librecorsa arcade-pro/source/pacman arcade-pro/source/2048 arcade-pro/source/trex-runner
          cp -R /tmp/gh-arcade/. arcade-pro/source/gh-arcade/
          cp -R /tmp/vibe-basketball/. arcade-pro/source/vibe-basketball/
          cp -R /tmp/f15-flight-sim/. arcade-pro/source/f15-flight-sim/
          cp -R /tmp/librecorsa/. arcade-pro/source/librecorsa/
          cp -R /tmp/pacman/. arcade-pro/source/pacman/
          cp -R /tmp/2048/. arcade-pro/source/2048/
          cp -R /tmp/trex-runner/. arcade-pro/source/trex-runner/
          mkdir -p arcade-pro/dark-room
          cp -R /tmp/adarkroom/. arcade-pro/dark-room/
          cp /tmp/adarkroom/LICENSE.md arcade-pro/dark-room/LICENSE.txt
          rm -rf arcade-pro/dark-room/.git arcade-pro/dark-room/.github
          python3 - <<'PY'
          from pathlib import Path
          p = Path('arcade-pro/dark-room/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.10.1/jquery.min.js"></script>', '')
          start = s.find('\\t<!-- Google tag (gtag.js) -->')
          if start != -1:
              config_start = s.find('gtag(', start)
              end = s.find('</script>', config_start)
              if end != -1:
                  s = s[:start] + s[end + len('</script>'):]
          p.write_text(s, encoding='utf-8')
          PY
          mkdir -p arcade-pro/trimps
          cp -R /tmp/trimps/. arcade-pro/trimps/
          cp /tmp/trimps/license.txt arcade-pro/trimps/LICENSE.txt
          rm -rf arcade-pro/trimps/.git arcade-pro/trimps/.github
          mkdir -p arcade-pro/shark-game
          cp -R /tmp/shark-game/. arcade-pro/shark-game/
          cp /tmp/shark-game/LICENSE.md arcade-pro/shark-game/LICENSE.txt
          rm -rf arcade-pro/shark-game/.git arcade-pro/shark-game/.github
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('arcade-pro/shark-game/index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'<script[^>]*>.*?GoogleAnalyticsObject.*?</script>', '', s, flags=re.I | re.S)
          s = re.sub(r'<!--\\[if lt IE 9\\]>.*?<!\\[endif\\]-->', '', s, flags=re.I | re.S)
          p.write_text(s, encoding='utf-8')
          PY
          mkdir -p arcade-pro/gridland
          cp -R /tmp/gridland/deploy/. arcade-pro/gridland/
          cp /tmp/gridland/LICENSE arcade-pro/gridland/LICENSE.txt
          mkdir -p arcade-pro/progress-knight
          cp -R /tmp/progress-knight/. arcade-pro/progress-knight/
          rm -rf arcade-pro/progress-knight/.git
          cp /tmp/progress-knight/LICENSE arcade-pro/progress-knight/LICENSE.txt
          mkdir -p arcade-pro/sloper arcade-pro/traffic-lane
          cp -R /tmp/study-desk/games/winterfold/. arcade-pro/sloper/
          cp -R /tmp/study-desk/games/lanewright/. arcade-pro/traffic-lane/
          cp /tmp/study-desk/bridge.js arcade-pro/bridge.js
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              'arcade-pro/sloper/index.html': [('Winterfold — Study Desk', 'Sloper · Mindspace'), ('<h1>Winter<i>fold</i></h1>', '<h1>Sloper</h1>'), ('<h2>Winterfold</h2>', '<h2>Sloper</h2>'), ('Winterfold save', 'Sloper save'), ('../../bridge.js', '../bridge.js')],
              'arcade-pro/sloper/engine.js': [('study-desk-winterfold-v1', 'mindspace-sloper-v1')],
              'arcade-pro/sloper/game.js': [('Winterfold', 'Sloper')],
              'arcade-pro/sloper/CREDITS.md': [('# Winterfold credits', '# Sloper credits'), ('Winterfold is an original game made for Study Desk.', 'Sloper is an original game, adapted for Mindspace with permission from its original collaborators.')],
              'arcade-pro/traffic-lane/index.html': [('Lanewright — Study Desk', 'Traffic Lane · Mindspace'), ('Lanewright', 'Traffic Lane'), ('lane that shares its colour', 'lane that shares its colour'), ('Lanewright save', 'Traffic Lane save'), ('../../bridge.js', '../bridge.js')],
              'arcade-pro/traffic-lane/engine.js': [('study-desk-lanewright-v1', 'mindspace-traffic-lane-v1')],
              'arcade-pro/traffic-lane/game.js': [('Lanewright', 'Traffic Lane')],
              'arcade-pro/traffic-lane/CREDITS.md': [('# Lanewright credits', '# Traffic Lane credits'), ('Lanewright is an original game made for Study Desk.', 'Traffic Lane is an original game, adapted for Mindspace with permission from its original collaborators.'), ('study-desk-lanewright-v1', 'mindspace-traffic-lane-v1')]
          }
          for name, pairs in replacements.items():
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              for old, new in pairs:
                  s = s.replace(old, new)
              p.write_text(s, encoding='utf-8')
          PY
          mkdir -p arcade-pro/evolve
          cd /tmp/evolve
          npm ci --no-audit --no-fund
          # This project lists Node 16 as a runtime dependency; remove its local shim so the build uses the Node 22 runner.
          rm -rf node_modules/node node_modules/.bin/node
          npm run build
          cp index.html save.html wiki.html evolved.ico evolved-light.ico LICENSE "$GITHUB_WORKSPACE/arcade-pro/evolve/"
          cp -R evolve lib font strings wiki "$GITHUB_WORKSPACE/arcade-pro/evolve/"
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('arcade-pro/evolve/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('    <script async src="https://www.googletagmanager.com/gtag/js?id=G-CPC46V71CB"></script>\n', '')
          start = s.find('    <script>\n        window.dataLayer')
          if start != -1:
              end = s.find('    </script>', start)
              if end != -1:
                  s = s[:start] + s[end + len('    </script>'):]
          p.write_text(s, encoding='utf-8')
          PY
          mkdir -p arcade-pro/stack
          cd /tmp/stack-game
          npm install --no-audit --no-fund
          npm run build
          cp -R dist/. "$GITHUB_WORKSPACE/arcade-pro/stack/"
          cp LICENSE "$GITHUB_WORKSPACE/arcade-pro/stack/LICENSE.txt"
          cd "$GITHUB_WORKSPACE"
          mkdir -p arcade-pro/hextris
          cp -R /tmp/hextris/. arcade-pro/hextris/
          mkdir -p arcade-pro/skifree
          cp -R /tmp/skifree/index.html /tmp/skifree/css /tmp/skifree/dist /tmp/skifree/js /tmp/skifree/*.png /tmp/skifree/yeti-big.png arcade-pro/skifree/ 2>/dev/null || true
          cp /tmp/skifree/license.md arcade-pro/skifree/LICENSE.txt
          python3 - <<'PY'
          from pathlib import Path
          p = Path('arcade-pro/skifree/index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<script src="dist/skifree.js"></script>'
          s = s[:s.index(marker) + len(marker)] + '\\n    </body>\\n</html>\\n'
          p.write_text(s, encoding='utf-8')
          PY
          sed -i 's|</body>|<p style="position:fixed;bottom:8px;left:8px;background:#fff;color:#222;padding:5px 8px;font:12px sans-serif;z-index:99">SkiFree.js by Daniel Hough · MIT License</p></body>|' arcade-pro/skifree/index.html
          rm -rf arcade-pro/hextris/.git arcade-pro/hextris/.github
          mkdir -p arcade-pro/3d-city
          cp -R /tmp/3d-city/. arcade-pro/3d-city/
          rm -rf arcade-pro/3d-city/.git arcade-pro/3d-city/.github
          mkdir -p arcade-pro/mk-fighter
          cp -R /tmp/mkjs/game/. arcade-pro/mk-fighter/
          cp /tmp/mkjs/readme.md arcade-pro/mk-fighter/MKJS-README.md
          cp mk-fighter/index.html arcade-pro/mk-fighter/index.html
          rm -rf arcade-pro/source/gh-arcade/.git arcade-pro/source/vibe-basketball/.git arcade-pro/source/f15-flight-sim/.git arcade-pro/source/librecorsa/.git arcade-pro/source/pacman/.git arcade-pro/source/2048/.git arcade-pro/source/trex-runner/.git
          rm -rf arcade-pro/source/gh-arcade/node_modules arcade-pro/source/vibe-basketball/node_modules arcade-pro/source/f15-flight-sim/node_modules arcade-pro/source/librecorsa/node_modules arcade-pro/source/librecorsa/.next arcade-pro/source/librecorsa/out arcade-pro/source/pacman/node_modules
          # Keep downloaded upstream source in the build workspace only.
          # Do not push it back to main: that creates a second deployment run.

      - name: Download and copy Gravity Forge and Pixel Princess
        run: |
          git clone --depth 1 https://github.com/Mohammed-Farzan-Javeed/gravity-forge.git /tmp/gravity-forge
          git clone --depth 1 https://github.com/VTvito/pixel-princess-platformer.git /tmp/pixel-princess
          git clone --depth 1 https://github.com/isocialPractice/street-crime.git /tmp/street-crime
          git clone --depth 1 https://github.com/mike007jd/voxel-musou.git /tmp/voxel-musou
          mkdir -p arcade-pro/gravity-forge arcade-pro/pixel-princess
          cp -R /tmp/gravity-forge/. arcade-pro/gravity-forge/
          cp /tmp/gravity-forge/LICENSE arcade-pro/gravity-forge/LICENSE.txt
          rm -rf arcade-pro/gravity-forge/.git arcade-pro/gravity-forge/.github
          cp -R /tmp/pixel-princess/. arcade-pro/pixel-princess/
          cp /tmp/pixel-princess/LICENSE arcade-pro/pixel-princess/LICENSE.txt
          # Two MIT-licensed single-player combat games, hosted entirely inside Mindspace.
          mkdir -p arcade-pro/street-crime arcade-pro/voxel-musou
          cp -R /tmp/street-crime/. arcade-pro/street-crime/
          cp /tmp/street-crime/LICENSE arcade-pro/street-crime/LICENSE.txt
          rm -rf arcade-pro/street-crime/.git arcade-pro/street-crime/.github
          # Hide developer/debug entries while leaving the original game code and menu wiring intact.
          sed -i 's|</head>|<style>#btn-debug,#btn-debug-level,#btn-sandbox{display:none!important}</style></head>|' arcade-pro/street-crime/index.html
          cp -R /tmp/voxel-musou/. arcade-pro/voxel-musou/
          cp /tmp/voxel-musou/LICENSE arcade-pro/voxel-musou/LICENSE.txt
          rm -rf arcade-pro/voxel-musou/.git arcade-pro/voxel-musou/.github arcade-pro/voxel-musou/checks arcade-pro/voxel-musou/media
          rm -f arcade-pro/voxel-musou/.vercelignore
          rm -rf arcade-pro/pixel-princess/.git arcade-pro/pixel-princess/.github arcade-pro/pixel-princess/.claude arcade-pro/pixel-princess/api arcade-pro/pixel-princess/tools
          rm -f arcade-pro/pixel-princess/sw.js arcade-pro/pixel-princess/vercel.json arcade-pro/pixel-princess/.vercelignore arcade-pro/pixel-princess/CLAUDE.md
          # Pixel Princess's upstream service worker deletes all origin caches on activation.
          # Remove its registration so it cannot interfere with Mindspace or other games.
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('arcade-pro/pixel-princess/src/main.js')
          s = p.read_text(encoding='utf-8')
          s, count = re.subn(r'\n// Register the service worker for offline play / PWA install.*?\n}\n\n// Dev-only test handle', '\n// Service worker disabled when embedded in Mindspace.\n\n// Dev-only test handle', s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Could not safely disable Pixel Princess service-worker registration')
          p.write_text(s, encoding='utf-8')
          p = Path('arcade-pro/pixel-princess/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('https://gameforprincess.vercel.app', 'https://anorak1342.github.io/mindspace/arcade-pro/pixel-princess')
          p.write_text(s, encoding='utf-8')
          PY
          # Keep the uploaded Flappy Bird-Remade self-contained by serving its Three.js module locally.
          mkdir -p arcade-pro/flappy-bird-remade
          curl -fsSL https://unpkg.com/three@0.160.0/build/three.module.js -o arcade-pro/flappy-bird-remade/three.module.js
          curl -fsSL https://raw.githubusercontent.com/mrdoob/three.js/r160/LICENSE -o arcade-pro/flappy-bird-remade/THREE-LICENSE.txt

      - name: Type-check and build the copied Neon Arcade source
        run: |
          cd arcade-pro/source/gh-arcade
          sed -i "s|const BASE = '/GH-Arcade/';|const BASE = '/mindspace/arcade-pro/';|" vite.config.ts
          npm ci
          npm run typecheck
          npm run build
          cp -R dist/. "$GITHUB_WORKSPACE/arcade-pro/"
          cp LICENSE "$GITHUB_WORKSPACE/arcade-pro/NEON-ARCADE-LICENSE.txt"

      - name: Build Pac-Man
        run: |
          cd arcade-pro/source/pacman
          npm ci
          npm run check
          npm run build
          mkdir -p "$GITHUB_WORKSPACE/arcade-pro/pacman"
          cp -R dist/. "$GITHUB_WORKSPACE/arcade-pro/pacman/"
          cp LICENSE "$GITHUB_WORKSPACE/arcade-pro/pacman/LICENSE.txt"

      - name: Build Snack Hole
        run: |
          cd /tmp/snack-hole-game
          npm ci
          npm run build -- --base=./
          mkdir -p "$GITHUB_WORKSPACE/arcade-pro/snack-hole"
          cp -R dist/. "$GITHUB_WORKSPACE/arcade-pro/snack-hole/"
          cp LICENSE "$GITHUB_WORKSPACE/arcade-pro/snack-hole/LICENSE.txt"
          cp CREDITS.md "$GITHUB_WORKSPACE/arcade-pro/snack-hole/CREDITS.md"

      - name: Publish Starstruck locally
        run: |
          mkdir -p arcade-pro/starstruck
          cp /tmp/starstruck/index.html arcade-pro/starstruck/index.html
          cp /tmp/starstruck/LICENSE arcade-pro/starstruck/LICENSE.txt
          # Keep the game fully local: no external login or third-party leaderboard.
          sed -i '/supabase-js@2.45.4/d' arcade-pro/starstruck/index.html

      - name: Remove tracking and ad scripts from Hextris
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('arcade-pro/hextris/index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'<script[^>]*googlesyndication[^>]*>.*?</script>', '', s, flags=re.I | re.S)
          s = re.sub(r'<script>.*?GoogleAnalyticsObject.*?</script>', '', s, flags=re.I | re.S)
          s = s.replace('http://fonts.googleapis.com', 'https://fonts.googleapis.com')
          s = s.replace('http://hextris.github.io', 'https://hextris.github.io')
          p.write_text(s, encoding='utf-8')
          PY
          cp arcade-pro/hextris/LICENSE.md arcade-pro/hextris/LICENSE.txt

      - name: Publish 2048 locally
        run: |
          mkdir -p arcade-pro/2048
          cp -R arcade-pro/source/2048/. arcade-pro/2048/

      - name: Publish T-Rex Runner locally
        run: |
          mkdir -p arcade-pro/trex-runner
          cp -R arcade-pro/source/trex-runner/. arcade-pro/trex-runner/
          rm -rf arcade-pro/trex-runner/.github arcade-pro/trex-runner/.git
          sed -i '/fonts.googleapis.com/d' arcade-pro/trex-runner/index.html
          cp arcade-pro/source/trex-runner/LICENSE arcade-pro/trex-runner/LICENSE.txt

      - name: Build the copied 3D basketball source
        run: |
          cd arcade-pro/source/vibe-basketball
          npm ci
          npm run build -- --base=./
          mkdir -p "$GITHUB_WORKSPACE/arcade-pro/basketball"
          cp -R dist/. "$GITHUB_WORKSPACE/arcade-pro/basketball/"
          cp LICENSE "$GITHUB_WORKSPACE/arcade-pro/basketball/LICENSE.txt"
          cp THIRD_PARTY_NOTICES.md "$GITHUB_WORKSPACE/arcade-pro/basketball/THIRD_PARTY_NOTICES.md"

      - name: Publish the F-15 Flight Sim locally
        run: |
          mkdir -p arcade-pro/f15-flight-sim
          cp arcade-pro/source/f15-flight-sim/F-15_Eagle_Flight_Simulator_v7.html arcade-pro/f15-flight-sim/index.html

      - name: Build LibreCorsa racing simulator
        run: |
          cd arcade-pro/source/librecorsa
          npm ci
          NEXT_PUBLIC_BASE_PATH=/mindspace/arcade-pro/librecorsa npm run build
          mkdir -p "$GITHUB_WORKSPACE/arcade-pro/librecorsa"
          cp -R out/. "$GITHUB_WORKSPACE/arcade-pro/librecorsa/"
          cp LICENSE "$GITHUB_WORKSPACE/arcade-pro/librecorsa/LICENSE.txt"
          cp CREDITS.md "$GITHUB_WORKSPACE/arcade-pro/librecorsa/CREDITS.md"

      - name: Add the three-Enter lock shortcut to every page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          script = r'''<script id="mindspace-lock-shortcut">
          (function () {
            var count = 0;
            var lastPress = 0;
            function basePath() {
              var path = window.location.pathname;
              return path === "/mindspace" || path.indexOf("/mindspace/") === 0 ? "/mindspace/" : "/";
            }
            function isArcadePath(path) {
              return path.indexOf("/arcade.html") !== -1 || path.indexOf("/arcade-pro/") !== -1 ||
                /\/(mini-metro|connect-four|tiny-traffic-town)\.html$/.test(path);
            }
            function toggleSpace(event) {
              var path = window.location.pathname;
              var base = basePath();
              var arcade = isArcadePath(path);
              event.preventDefault();
              event.stopPropagation();
              event.stopImmediatePropagation();
              if (arcade) {
                try { localStorage.removeItem("ms-arcade-unlocked"); } catch (error) {}
                window.location.assign(base);
              } else {
                try { localStorage.setItem("ms-arcade-unlocked", "yes"); } catch (error) {}
                window.location.assign(base + "arcade.html");
              }
            }
            window.addEventListener("keydown", function (event) {
              if (event.repeat || event.isComposing) return;
              var target = event.target;
              if (target && (target.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(target.tagName))) return;
              if (event.code === "ControlLeft" || event.code === "ControlRight" ||
                  event.code === "Digit1" || event.code === "Numpad1") {
                toggleSpace(event);
                return;
              }
              if (event.key !== "Enter") return;
              if (target && /^(BUTTON)$/.test(target.tagName)) {
                count = 0;
                lastPress = 0;
                return;
              }
              var now = Date.now();
              count = now - lastPress <= 3000 ? count + 1 : 1;
              lastPress = now;
              if (count < 3) return;
              count = 0;
              toggleSpace(event);
            }, true);
          })();
          </script>'''
          for page in Path(".").rglob("*.html"):
              if ".git" in page.parts or "source" in page.parts or ("crossy-road" in page.parts and "game" in page.parts):
                  continue
              content = page.read_text(encoding="utf-8")
              is_arcade = (
                  page == Path("arcade.html")
                  or "arcade-pro" in page.parts
                  or page.name in {"mini-metro.html", "connect-four.html", "tiny-traffic-town.html"}
              )
              if is_arcade and "mindspace-lock.js" not in content:
                  relative_lock = "../" * (len(page.parts) - 1) + "mindspace-lock.js"
                  lock_tag = f'<script src="{relative_lock}" defer></script>'
                  if "</head>" in content:
                      content = content.replace("</head>", lock_tag + "\n</head>", 1)
                  else:
                      content = lock_tag + content
              if is_arcade:
                  import re
                  content = re.sub(r"<title>.*?</title>", "<title>Mindspace</title>", content, count=1, flags=re.I | re.S)
                  title_guard = '<script id="mindspace-history-title">document.title="Mindspace";new MutationObserver(()=>{if(document.title!=="Mindspace")document.title="Mindspace"}).observe(document.head,{subtree:true,childList:true,characterData:true});</script>'
                  if 'id="mindspace-history-title"' not in content and "</head>" in content:
                      content = content.replace("</head>", title_guard + "\n</head>", 1)
              if 'id="mindspace-lock-shortcut"' not in content:
                  if "</body>" in content:
                      content = content.replace("</body>", script + "\n</body>", 1)
                  else:
                      content += script
              page.write_text(content, encoding="utf-8")
          PY

      - name: Add looping Mountain King background music
        run: |
          mkdir -p assets
          curl -fL --retry 3 "https://incompetech.com/music/royalty-free/mp3-royaltyfree/Hall%20of%20the%20Mountain%20King.mp3" -o assets/mountain-king.mp3
          python3 - <<'PY'
          from pathlib import Path
          player = r"""<style id="mindspace-music-style">
          #mindspace-music-wrap{position:fixed;right:14px;bottom:14px;z-index:2147483000;display:flex;flex-direction:column;align-items:flex-end;gap:4px;font:12px/1.35 system-ui,sans-serif}
          #mindspace-music-toggle{border:1px solid #8ce8c5;background:#151b25;color:#a7f3d0;border-radius:999px;padding:9px 13px;font:700 12px system-ui,sans-serif;cursor:pointer;box-shadow:0 4px 18px #0008}
          #mindspace-music-credit{color:#c5c8d5;background:#151b25eF;border:1px solid #ffffff22;border-radius:7px;padding:4px 7px;font-size:10px}
          #mindspace-music-credit a{color:#a7f3d0}
          </style>
          <div id="mindspace-music-wrap">
            <button id="mindspace-music-toggle" type="button" aria-pressed="false">♫ Turn music on</button>
            <small id="mindspace-music-credit">Hall of the Mountain King · Kevin MacLeod · <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener noreferrer">CC BY 4.0</a></small>
          </div>
          <audio id="mindspace-background-music" loop preload="none"></audio>
          <script id="mindspace-background-music-script">
          (function(){
            var audio=document.getElementById("mindspace-background-music");
            var button=document.getElementById("mindspace-music-toggle");
            if(!audio||!button)return;
            var base=location.pathname.indexOf("/mindspace/")===0?"/mindspace/":"/";
            audio.src=base+"assets/mountain-king.mp3";
            audio.volume=0.24;
            function label(on){
              button.textContent=on?"♫ Music: On":"♫ Turn music on";
              button.setAttribute("aria-pressed",on?"true":"false");
            }
            function start(){
              var result=audio.play();
              if(result&&typeof result.then==="function"){
                result.then(function(){label(true);}).catch(function(){label(false);});
              }else{label(true);}
            }
            button.addEventListener("click",function(){
              if(!audio.paused){audio.pause();try{localStorage.setItem("mindspace-music-enabled","no");}catch(e){}label(false);return;}
              try{localStorage.setItem("mindspace-music-enabled","yes");}catch(e){}
              start();
            });
            try{if(localStorage.getItem("mindspace-music-enabled")==="yes")start();}catch(e){}
            audio.addEventListener("pause",function(){label(false);});
            audio.addEventListener("play",function(){label(true);});
          })();
          </script>"""
          # The music control belongs only on the arcade library page.
          # Game pages keep their own audio and controls untouched.
          page = Path("arcade.html")
          content = page.read_text(encoding="utf-8")
          if 'id="mindspace-background-music-script"' not in content:
              if "</body>" in content:
                  content = content.replace("</body>", player + "\n</body>", 1)
              else:
                  content += player
              page.write_text(content, encoding="utf-8")

      - name: Remove build-only source files before publishing
        run: |
          # The original repositories are only needed while building. Publishing
          # them bloats the Pages artifact and can exceed GitHub's 1 GB limit.
          rm -rf arcade-pro/source

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
