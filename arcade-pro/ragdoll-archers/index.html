<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#090909">
<title>Ragdoll Archers | Mindspace Arcade</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<a id="mindspace-back" href="../../arcade.html">← Mindspace Arcade</a>
<div id="unity-container" class="unity-desktop"><canvas id="unity-canvas"></canvas></div>
<div id="loading-cover">
  <div id="unity-loading-bar">
    <div id="unity-logo"><img src="https://cdn.jsdelivr.net/gh/MakkaPakka-7788/Ragdoll-Archerss@main/logo.jpeg" alt="Ragdoll Archers"></div>
    <div class="progress-spinner-container">
      <div class="spinner-left"><img src="https://cdn.jsdelivr.net/gh/MakkaPakka-7788/Ragdoll-Archerss@main/spinner.png" alt=""></div>
      <div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div>
      <div class="spinner-right"><img src="https://cdn.jsdelivr.net/gh/MakkaPakka-7788/Ragdoll-Archerss@main/spinner.png" alt=""></div>
    </div>
    <p id="loading-label">Loading Ragdoll Archers…</p>
  </div>
</div>
<script>
  const buildUrl = "https://cdn.jsdelivr.net/gh/MakkaPakka-7788/Ragdoll-Archerss@main/Build";
  const loaderUrl = "Build/v111.loader.js";
  const config = {
    dataUrl: buildUrl + "/6697b6deba8b617c67b69c55dcd07cb1.data.unityweb",
    frameworkUrl: buildUrl + "/0be3c3ee7115b26e1ae28e643afdf1f2.js.unityweb",
    codeUrl: buildUrl + "/b3397c29f6878557c1c614cbf9e196ea.wasm.unityweb",
    streamingAssetsUrl: buildUrl + "/StreamingAssets",
    companyName: "Ericetto",
    productName: "Ragdoll Archers",
    productVersion: "0.1"
  };
  const container = document.querySelector("#unity-container");
  const canvas = document.querySelector("#unity-canvas");
  const loadingCover = document.querySelector("#loading-cover");
  const progressBarFull = document.querySelector("#unity-progress-bar-full");
  if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) container.className = "unity-mobile";
  const unityLoader = document.createElement("script");
  unityLoader.src = loaderUrl;
  unityLoader.onload = () => {
    createUnityInstance(canvas, config, progress => {
      progressBarFull.style.width = (100 * progress) + "%";
    }).then(instance => {
      window.unityInstance = instance;
      loadingCover.style.display = "none";
    }).catch(error => {
      document.getElementById("loading-label").textContent = "Could not start the game. Try refreshing the page.";
      console.error(error);
    });
  };
  unityLoader.onerror = () => {
    document.getElementById("loading-label").textContent = "The Unity loader could not be found.";
  };
  document.body.appendChild(unityLoader);
  document.addEventListener("pointerdown", () => {
    container.focus(); window.focus(); canvas.focus();
  });
</script>
<footer>Original Ragdoll Archers game by MakkaPakka-7788. Unity game assets are served from the original public repository via jsDelivr.</footer>
</body>
</html>
