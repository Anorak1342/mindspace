<script>

(function () {
  var HOST = 'footballbros.io';

  function lock(obj) {
    ['hostName', 'hostNameFull'].forEach(function (k) {
      try {
        Object.defineProperty(obj, k, {
          configurable: true,
          get: function () { return HOST; },
          set: function () {}
        });
      } catch (e) { try { obj[k] = HOST; } catch (e2) {} }
    });
  }
  var tries = 0;
  (function wait() {
    if (window.Main && typeof window.Main === 'function') { lock(window.Main); return; }
    if (window.Main && typeof window.Main === 'object') { lock(window.Main); }
    if (++tries < 600) setTimeout(wait, 20);
  })();

  var PROBE = /^https?:\/\/fb\.[^/]+\/?\?.*ping=true/i;
  var LIST = /docs\.google\.com\/spreadsheets/i;
  var xOpen = XMLHttpRequest.prototype.open, xSend = XMLHttpRequest.prototype.send;
  XMLHttpRequest.prototype.open = function (method, url) {
    var u = String(url || '');
    this.__skip = PROBE.test(u) || LIST.test(u);
    return xOpen.apply(this, arguments);
  };
  XMLHttpRequest.prototype.send = function () {
    if (this.__skip) return;
    return xSend.apply(this, arguments);
  };

  var d = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, 'src');
  if (d && d.set) {
    try {
      Object.defineProperty(HTMLImageElement.prototype, 'src', {
        configurable: true,
        enumerable: d.enumerable,
        get: d.get,
        set: function (v) {
          if (/^https?:\/\/fb\.[^/]+\/site\.png/i.test(String(v || ''))) {
            var img = this;
            setTimeout(function () {
              try { if (typeof img.onerror === 'function') img.onerror(new Event('error')); } catch (e) {}
            }, 0);
            return;
          }
          return d.set.call(this, v);
        }
      });
    } catch (e) {}
  }

  window.open = function () { return null; };

  var AC = window.AudioContext || window.webkitAudioContext;
  if (AC) {
    var pool = [];
    function W() { var c = new AC(arguments[0]); pool.push(c); return c; }
    W.prototype = AC.prototype;
    try {
      window.AudioContext = W;
      if (window.webkitAudioContext) window.webkitAudioContext = W;
    } catch (e) {}
    function wake() {
      for (var i = 0; i < pool.length; i++) {
        try { if (pool[i].state === 'suspended') pool[i].resume(); } catch (e) {}
      }
    }
    ['pointerdown', 'keydown', 'touchstart'].forEach(function (t) { window.addEventListener(t, wake, true); });
  }
})();
</script>
