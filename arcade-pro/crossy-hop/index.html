<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crossy Hop | Mindspace</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090d12;color:#f5f7f8;font:15px system-ui,sans-serif;display:grid;min-height:100vh;place-items:center}.shell{width:min(960px,96vw);padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.top a{color:#8ce8c2;text-decoration:none;font-weight:800}.brand{font-weight:900;letter-spacing:1px}.brand span{color:#8ce8c2}canvas{display:block;width:100%;height:min(72vh,680px);min-height:420px;background:#8fcf74;border:2px solid #263b31;border-radius:14px;touch-action:none}.hint{color:#aeb9b7;text-align:center;font-size:13px}.hud{display:flex;gap:16px;justify-content:center;font-weight:800;margin:10px}.hud b{color:#8ce8c2}button{background:#8ce8c2;border:0;border-radius:8px;padding:10px 18px;font-weight:900;cursor:pointer}.actions{display:flex;justify-content:center;gap:8px}
</style></head><body><main class="shell"><header class="top"><div class="brand">MINDSpace <span>✳ CROSSY HOP</span></div><a href="../arcade.html">← Arcade</a></header><div class="hud"><span>LANE <b id="score">0</b></span><span>BEST <b id="best">0</b></span></div><canvas id="game" width="720" height="640" aria-label="Crossy Hop game"></canvas><p class="hint">Move with WASD or arrow keys. On phones, swipe or tap the direction pad.</p><div class="actions"><button id="restart">↻ Restart</button></div></main>
<script>
(()=>{const c=document.querySelector('#game'),x=c.getContext('2d'),scoreEl=document.querySelector('#score'),bestEl=document.querySelector('#best');let player,lanes,score,best=+(localStorage.crossyHopBest||0),over,last=0,acc=0;bestEl.textContent=best;
const W=720,H=640,S=40,COLS=18,ROWS=16;
function reset(){player={x:9,y:14,drawX:9,drawY:14};score=0;over=false;lanes=[];for(let y=0;y<ROWS;y++)lanes.push(makeLane(y));scoreEl.textContent=0}
function makeLane(y){let type=y<3?'grass':(Math.random()<.62?'road':'water'),speed=(.7+Math.random()*1.15)*(Math.random()<.5?-1:1);return{y,type,speed,items:Array.from({length:type==='grass'?0:3+Math.floor(Math.random()*2)},(_,i)=>({x:i*5+Math.random()*2,w:type==='water'?2+Math.random()*2:1+Math.random()*1.4}))}}
function move(dx,dy){if(over)return;if(dy<0&&player.y<=0)return;const nx=Math.max(0,Math.min(COLS-1,player.x+dx)),ny=Math.max(0,Math.min(ROWS-1,player.y+dy));player.x=nx;player.y=ny;if(ny<14){score=Math.max(score,14-ny);scoreEl.textContent=score;if(score>best){best=score;bestEl.textContent=best;localStorage.crossyHopBest=best}}}
function draw(){x.clearRect(0,0,W,H);for(let y=0;y<ROWS;y++){let l=lanes[y],py=y*S;x.fillStyle=l.type==='grass'?(y%2?'#8fcf74':'#83c66b'):l.type==='road'?'#424a50':'#287c9b';x.fillRect(0,py,W,S);if(l.type==='road'){x.fillStyle='#d7d5ad';for(let xx=0;xx<W;xx+=100)x.fillRect(xx,py+19,48,3)}if(l.type!=='grass')for(const it of l.items){x.fillStyle=l.type==='water'?'#ad8050':['#e3a23d','#d95d48','#6b9cc9'][Math.abs(Math.floor(it.x))%3];x.fillRect(it.x*S,py+5,it.w*S-4,30);if(l.type==='water'){x.fillStyle='#d4b17b';x.fillRect(it.x*S+5,py+9,it.w*S-16,5)}}}
const px=player.x*S+20,py=player.y*S+20;x.fillStyle='#f4f1e9';x.beginPath();x.arc(px,py,14,0,Math.PI*2);x.fill();x.fillStyle='#e8a83d';x.fillRect(px-8,py-3,16,10);x.fillStyle='#20282a';x.fillRect(px-7,py-8,4,4);x.fillRect(px+3,py-8,4,4);
if(over){x.fillStyle='#081018cc';x.fillRect(0,0,W,H);x.fillStyle='white';x.textAlign='center';x.font='bold 42px system-ui';x.fillText('SPLAT!',W/2,H/2-12);x.font='18px system-ui';x.fillText('Press Space or Restart to try again',W/2,H/2+28)}}
function tick(t){let dt=Math.min(.04,(t-last)/1000||0);last=t;if(!over){for(let l of lanes)if(l.type!=='grass'){for(let it of l.items){it.x+=l.speed*dt;if(it.x>COLS+2)it.x=-it.w;if(it.x<-it.w-1)it.x=COLS+1}if(l.y===player.y){let hit=l.items.some(it=>player.x+.38>it.x&&player.x-.38<it.x+it.w);if(l.type==='road'&&hit)over=true;if(l.type==='water'&&!hit)over=true}}}draw();requestAnimationFrame(tick)}
function key(e){let m={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]};if(e.key===' '&&over){reset();return}if(m[e.key]){e.preventDefault();move(...m[e.key])}}
let sx=0,sy=0;c.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});c.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<15)return;if(Math.abs(dx)>Math.abs(dy))move(Math.sign(dx),0);else move(0,Math.sign(dy)*-1)},{passive:true});window.addEventListener('keydown',key);document.querySelector('#restart').onclick=reset;reset();requestAnimationFrame(tick)})();
</script></body></html>
