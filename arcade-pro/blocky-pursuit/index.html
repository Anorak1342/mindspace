<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blocky Pursuit | Mindspace</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090d12;color:#f5f7f8;font:15px system-ui,sans-serif;display:grid;min-height:100vh;place-items:center}.shell{width:min(960px,96vw);padding:18px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.top a{color:#8ce8c2;text-decoration:none;font-weight:800}.brand{font-weight:900;letter-spacing:1px}.brand span{color:#8ce8c2}canvas{display:block;width:100%;height:min(72vh,680px);min-height:420px;background:#273b35;border:2px solid #344b43;border-radius:14px}.hud{display:flex;justify-content:center;gap:22px;margin:10px;font-weight:800}.hud b{color:#8ce8c2}.hint{text-align:center;color:#aeb9b7;font-size:13px}button{background:#8ce8c2;border:0;border-radius:8px;padding:10px 18px;font-weight:900;cursor:pointer}.actions{display:flex;justify-content:center}
</style></head><body><main class="shell"><header class="top"><div class="brand">MINDSpace <span>✳ BLOCKY PURSUIT</span></div><a href="../arcade.html">← Arcade</a></header><div class="hud"><span>TIME <b id="time">0.0</b>s</span><span>BEST <b id="best">0.0</b>s</span><span>HEAT <b id="heat">1</b></span></div><canvas id="game" width="720" height="640"></canvas><p class="hint">Drive with WASD or arrow keys. Avoid police cars and buildings. Survive as long as possible.</p><div class="actions"><button id="restart">↻ Restart</button></div></main>
<script>
(()=>{const c=document.querySelector('#game'),g=c.getContext('2d'),timeEl=document.querySelector('#time'),bestEl=document.querySelector('#best'),heatEl=document.querySelector('#heat');let car,cops,buildings,keys={},elapsed,best=+(localStorage.blockyPursuitBest||0),dead,last,spawn;bestEl.textContent=best.toFixed(1);const W=720,H=640;
function reset(){car={x:360,y:490,a:-Math.PI/2,v:0};cops=[];buildings=[];elapsed=0;dead=false;spawn=0;for(let i=0;i<18;i++)buildings.push({x:Math.random()*W,y:Math.random()*H,w:45+Math.random()*65,h:35+Math.random()*65});timeEl.textContent='0.0'}
function rect(x,y,w,h,color){g.fillStyle=color;g.fillRect(x-w/2,y-h/2,w,h)}
function carDraw(o,color){g.save();g.translate(o.x,o.y);g.rotate(o.a);rect(0,0,32,48,color);rect(0,-5,22,20,'#b7d9dc');rect(-13,-14,5,11,'#171b1e');rect(13,-14,5,11,'#171b1e');rect(-13,15,5,11,'#171b1e');rect(13,15,5,11,'#171b1e');g.restore()}
function update(dt){if(dead)return;elapsed+=dt;timeEl.textContent=elapsed.toFixed(1);heatEl.textContent=Math.min(5,1+Math.floor(elapsed/12));let accel=(keys.ArrowUp||keys.w?1:0)-(keys.ArrowDown||keys.s?1:0);car.v=Math.max(-130,Math.min(230,car.v+accel*300*dt));car.v*=Math.pow(.985,dt*60);let turn=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0);car.a+=turn*2.6*dt*(.3+Math.abs(car.v)/180);car.x+=Math.cos(car.a)*car.v*dt;car.y+=Math.sin(car.a)*car.v*dt;car.x=(car.x+W)%W;car.y=(car.y+H)%H;
spawn-=dt;if(spawn<=0){let side=Math.floor(Math.random()*4),p=side===0?{x:0,y:Math.random()*H}:side===1?{x:W,y:Math.random()*H}:side===2?{x:Math.random()*W,y:0}:{x:Math.random()*W,y:H};cops.push({...p,a:Math.atan2(car.y-p.y,car.x-p.x),v:70+Math.random()*25});spawn=Math.max(1.1,4-elapsed*.035)}
for(let p of cops){let target=Math.atan2(car.y-p.y,car.x-p.x),d=Math.atan2(Math.sin(target-p.a),Math.cos(target-p.a));p.a+=Math.max(-1,Math.min(1,d))*1.6*dt;p.x+=Math.cos(p.a)*p.v*dt;p.y+=Math.sin(p.a)*p.v*dt;let dx=p.x-car.x,dy=p.y-car.y;if(dx*dx+dy*dy<1050)dead=true}
for(let b of buildings){let dx=Math.abs(car.x-b.x),dy=Math.abs(car.y-b.y);if(dx<b.w/2+12&&dy<b.h/2+12)dead=true}
if(elapsed>best){best=elapsed;bestEl.textContent=best.toFixed(1);localStorage.blockyPursuitBest=best}}
function draw(){g.fillStyle='#283d35';g.fillRect(0,0,W,H);g.strokeStyle='#52665a';g.lineWidth=2;for(let x=0;x<W;x+=90){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke()}for(let y=0;y<H;y+=90){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}for(let b of buildings){rect(b.x,b.y,b.w,b.h,'#53645b');rect(b.x,b.y,b.w-10,b.h-10,'#687b70')}for(let p of cops)carDraw(p,'#e6e8ed');carDraw(car,'#f2b84b');if(dead){g.fillStyle='#070b0dcc';g.fillRect(0,0,W,H);g.fillStyle='white';g.textAlign='center';g.font='bold 42px system-ui';g.fillText('BUSTED!',W/2,H/2-12);g.font='18px system-ui';g.fillText('Survived '+elapsed.toFixed(1)+' seconds',W/2,H/2+26);g.fillText('Press Space or Restart to go again',W/2,H/2+58)}}
function loop(t){let dt=Math.min(.04,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}window.addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' '&&dead)reset();if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault()});window.addEventListener('keyup',e=>keys[e.key]=false);document.querySelector('#restart').onclick=reset;reset();requestAnimationFrame(loop)})();
</script></body></html>
