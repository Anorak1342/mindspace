<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090909"><title>Mindspace · Sign in</title>
<style>
:root{color-scheme:dark;--bg:#090909;--panel:#121512;--line:#343b36;--text:#f5f2ed;--muted:#a0aaa3;--mint:#83e6bd}
*{box-sizing:border-box}.hidden{display:none!important}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 50% 0%,#263b39 0%,#101512 48%,#080909 100%);color:var(--text);font:15px/1.5 system-ui,Segoe UI,sans-serif}
.card{width:min(460px,100%);padding:30px;border:1px solid #ffffff20;border-radius:18px;background:#111715;box-shadow:0 24px 90px #0009}
.brand{font-weight:900;letter-spacing:.5px}.brand span{color:var(--mint)}.eyebrow{margin-top:28px;color:var(--mint);font-size:10px;font-weight:900;letter-spacing:2px}
h1{font:700 clamp(32px,7vw,43px)/1.08 Georgia,serif;margin:8px 0}.muted{color:var(--muted);margin:0 0 22px}
label{display:block;font-size:12px;color:#c2cbc5;margin:13px 0 6px}input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:8px;background:#0b0e0c;color:var(--text);font:inherit}input:focus{outline:2px solid var(--mint);outline-offset:2px}
button{width:100%;padding:13px;border:0;border-radius:8px;background:var(--mint);color:#08140e;font-weight:900;font:inherit;cursor:pointer;margin-top:13px}
button.secondary{background:#202722;color:#f5f2ed;border:1px solid #414a43}button:disabled{opacity:.6;cursor:wait}
.switch{display:flex;justify-content:center;gap:7px;margin-top:18px;color:var(--muted);font-size:13px}.switch button{width:auto;margin:0;padding:0;background:none;color:var(--mint);font-weight:800}
.error{min-height:20px;color:#ff9b9b;font-size:12px;margin-top:12px;white-space:pre-wrap}.foot{margin-top:24px;text-align:center;font-size:12px}.foot a{color:var(--mint);text-decoration:none}
</style></head>
<body><main class="card">
<div class="brand">mindspace <span>✳ ACCOUNT</span></div>
<div class="eyebrow">YOUR ARCADE PASS</div><h1 id="heading">Sign in to Mindspace.</h1>
<p class="muted" id="intro">Sign in to unlock every game and keep your progress connected.</p>
<button id="google" class="secondary" type="button">Continue with Google</button>
<div style="display:flex;align-items:center;gap:12px;margin:18px 0;color:#69746d;font-size:11px"><span style="height:1px;background:#343b36;flex:1"></span>OR USE EMAIL<span style="height:1px;background:#343b36;flex:1"></span></div>
<form id="authForm">
<label for="email">Email address</label><input id="email" type="email" autocomplete="email" required>
<label for="password">Password</label><input id="password" type="password" minlength="6" autocomplete="current-password" required>
<button id="submit" type="submit">Sign in</button>
</form>
<div class="switch"><span id="switchText">New to Mindspace?</span><button id="switch" type="button">Create an account</button></div>
<div class="error" id="message" role="alert"></div>
<div class="foot"><a href="./arcade.html">← Back to the arcade</a></div>
</main>
<script type="module">
import {initializeApp,getApps} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,GoogleAuthProvider,signInWithPopup,signOut} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";
const config={apiKey:"AIzaSyDymemJH4sSueC3PtiRsFlzdO_sR3yf2u4",authDomain:"mindspace-59b2d.firebaseapp.com",projectId:"mindspace-59b2d",storageBucket:"mindspace-59b2d.firebasestorage.app",messagingSenderId:"17331225260",appId:"1:17331225260:web:251d323c504ef116465509"};
const app=getApps().length?getApps()[0]:initializeApp(config),auth=getAuth(app);
const $=id=>document.getElementById(id);let creating=false;
const params=new URLSearchParams(location.search),requested=params.get("return");
const destination=requested==="arcade"?"./arcade.html":"./arcade.html";
function message(text){$("message").textContent=text}
function updateMode(){ $("heading").textContent=creating?"Create your account.":"Sign in to Mindspace."; $("intro").textContent=creating?"Create a free account to unlock every game and sync your progress.":"Sign in to unlock every game and keep your progress connected."; $("submit").textContent=creating?"Create account":"Sign in"; $("switchText").textContent=creating?"Already have an account?":"New to Mindspace?"; $("switch").textContent=creating?"Sign in":"Create an account"; $("password").autocomplete=creating?"new-password":"current-password"; }
$("switch").onclick=()=>{creating=!creating;message("");updateMode()};
$("authForm").addEventListener("submit",async event=>{event.preventDefault();message("");$("submit").disabled=true;try{const email=$("email").value.trim(),password=$("password").value;if(creating)await createUserWithEmailAndPassword(auth,email,password);else await signInWithEmailAndPassword(auth,email,password);location.href=destination;}catch(e){message(e.message||"Could not sign in. Please try again.");}finally{$("submit").disabled=false;}});
$("google").onclick=async()=>{message("");$("google").disabled=true;try{await signInWithPopup(auth,new GoogleAuthProvider());location.href=destination;}catch(e){message(e.message||"Google sign-in could not be completed.");}finally{$("google").disabled=false;}};
onAuthStateChanged(auth,user=>{if(user){$("heading").textContent="You're signed in."; $("intro").textContent="Your Mindspace account is ready. All arcade games are unlocked."; $("authForm").classList.add("hidden");$("google").classList.add("hidden");$("switch").classList.add("hidden");$("switchText").textContent="";const b=document.createElement("button");b.className="secondary";b.textContent="Continue to the arcade";b.onclick=()=>location.href=destination;$("message").before(b);}});
updateMode();
</script></body></html>
